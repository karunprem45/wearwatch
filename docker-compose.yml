# Two services: the inference API and a replay client that streams held-out telemetry to it.
# The model is mounted read-only, so a new model is a file swap and a restart, not a rebuild.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    environment:
      ALERT_K: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"        # pretend this is a small edge box
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  replay:
    build:
      context: .
      dockerfile: Dockerfile.replay
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro
    environment:
      API_URL: http://api:8000
    command: ["python", "-m", "scripts.replay", "--machines", "5", "--rate", "50"]
